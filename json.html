<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON 格式化校验工具 | 100%纯本地处理 | Free Tools</title>
    <meta name="description" content="纯本地运行的 JSON 格式化与校验工具。所有数据均在浏览器端处理，绝不上传服务器，保护您的机密代码和数据。">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隐藏滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Fira+Code&display=swap');
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8fafc; }
        .gradient-text { background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        textarea { font-family: 'Fira Code', monospace; tab-size: 2; }
    </style>
</head>
<body class="min-h-screen py-12 px-4">
<nav class="bg-white border-b border-gray-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16">

            <div class="flex-shrink-0 flex items-center">
                <a href="/" class="flex items-center gap-2 hover:opacity-80 transition-opacity">
                    <span class="text-2xl">🧰</span>
                    <span class="font-extrabold text-gray-900 text-xl tracking-tight">FreeTools<span class="text-blue-600">.best</span></span>
                </a>
            </div>

            <div class="flex-1 flex justify-end overflow-x-auto no-scrollbar ml-4">
                <div class="flex space-x-2 py-1">
                    <a href="zh.html" class="px-4 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-colors whitespace-nowrap">
                        🖼️ 图片压缩
                    </a>
                    <a href="password.html" class="px-4 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-colors whitespace-nowrap">
                        🔑 密码生成
                    </a>
                    <a href="json.html" class="px-4 py-2 text-sm font-bold rounded-lg text-gray-900 bg-gray-100 hover:bg-gray-200 transition-colors whitespace-nowrap">
                        { } JSON 工具
                    </a>
                    <a href="qrcode.html" class="px-4 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:text-gray-900 hover:bg-gray-50 transition-colors whitespace-nowrap">
                        📱 二维码生成
                    </a>
                </div>
            </div>

        </div>
    </div>
</nav>
<div class="max-w-6xl mx-auto">
    <header class="text-center mb-10">
        <div class="inline-flex items-center gap-2 mb-4 bg-purple-50 text-purple-600 px-4 py-1.5 rounded-full text-sm font-semibold">
            🛡️ 纯本地解析，保护机密数据
        </div>
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">
            JSON 格式化与校验
        </h1>
    </header>

    <main class="bg-white rounded-[2rem] shadow-xl shadow-purple-100/50 border border-gray-100 p-6 lg:p-8 flex flex-col h-[70vh]">

        <div class="flex flex-wrap items-center justify-between gap-4 mb-4 pb-4 border-b border-gray-100">
            <div class="flex gap-2">
                <button id="btnFormat" class="px-6 py-2 bg-purple-600 hover:bg-purple-700 text-white font-semibold rounded-lg shadow-md transition-colors">
                    美化 (Format)
                </button>
                <button id="btnMinify" class="px-6 py-2 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg transition-colors">
                    压缩 (Minify)
                </button>
                <button id="btnClear" class="px-6 py-2 text-gray-400 hover:text-red-500 font-semibold transition-colors">
                    清空
                </button>
            </div>
            <div id="statusMsg" class="font-medium text-sm px-4 py-2 rounded-lg bg-gray-50 text-gray-500">
                等待输入...
            </div>
        </div>

        <div class="flex-1 flex flex-col lg:flex-row gap-6">
            <div class="flex-1 flex flex-col">
                <label class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">输入原始 JSON</label>
                <textarea id="jsonInput" class="flex-1 w-full p-4 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-purple-500 focus:border-purple-500 outline-none resize-none" placeholder='{"hello": "world"}'></textarea>
            </div>

            <div class="flex-1 flex flex-col relative">
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs font-bold text-gray-400 uppercase tracking-widest">输出结果</label>
                    <button id="btnCopy" class="text-xs text-purple-600 font-bold hover:text-purple-800 hidden">复制结果</button>
                </div>
                <textarea id="jsonOutput" class="flex-1 w-full p-4 bg-gray-800 text-green-400 border border-gray-700 rounded-xl outline-none resize-none" readonly placeholder="格式化后的 JSON 将显示在这里..."></textarea>
            </div>
        </div>
    </main>
</div>

<script>
    const input = document.getElementById('jsonInput');
    const output = document.getElementById('jsonOutput');
    const statusMsg = document.getElementById('statusMsg');
    const btnCopy = document.getElementById('btnCopy');

    function processJSON(isMinify = false) {
        const rawVal = input.value.trim();
        if (!rawVal) {
            showStatus('请输入 JSON 数据', 'gray');
            output.value = '';
            btnCopy.classList.add('hidden');
            return;
        }

        try {
            // 核心：利用浏览器原生 JSON 对象解析和格式化
            const parsed = JSON.parse(rawVal);
            const result = isMinify ? JSON.stringify(parsed) : JSON.stringify(parsed, null, 4);

            output.value = result;
            output.classList.remove('text-red-400');
            output.classList.add('text-green-400');
            showStatus('✅ JSON 格式有效', 'green');
            btnCopy.classList.remove('hidden');
        } catch (err) {
            output.value = `❌ 解析错误:\n\n${err.message}`;
            output.classList.remove('text-green-400');
            output.classList.add('text-red-400');
            showStatus('❌ JSON 格式错误', 'red');
            btnCopy.classList.add('hidden');
        }
    }

    function showStatus(msg, color) {
        statusMsg.textContent = msg;
        statusMsg.className = `font-medium text-sm px-4 py-2 rounded-lg bg-${color}-50 text-${color}-600`;
    }

    document.getElementById('btnFormat').addEventListener('click', () => processJSON(false));
    document.getElementById('btnMinify').addEventListener('click', () => processJSON(true));

    document.getElementById('btnClear').addEventListener('click', () => {
        input.value = '';
        output.value = '';
        showStatus('等待输入...', 'gray');
        btnCopy.classList.add('hidden');
    });

    btnCopy.addEventListener('click', async () => {
        await navigator.clipboard.writeText(output.value);
        const origText = btnCopy.textContent;
        btnCopy.textContent = '已复制！';
        setTimeout(() => btnCopy.textContent = origText, 2000);
    });

    // 支持输入框内直接按 Tab 键缩进
    input.addEventListener('keydown', function(e) {
        if (e.key == 'Tab') {
            e.preventDefault();
            const start = this.selectionStart;
            const end = this.selectionEnd;
            this.value = this.value.substring(0, start) + "  " + this.value.substring(end);
            this.selectionStart = this.selectionEnd = start + 2;
        }
    });
</script>
</body>
</html>
