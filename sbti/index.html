r. Voce gasta dinheiro, tempo e energia sem limite, esperando migalhas minusculas de afeto.","BOSS":"Tipo lider logico. Voce organiza naturalmente e ganha controle por meio de metas. E bom em mandar, menos bom em entender.","JOKE-R":"Tipo palhaço performatico. Voce transforma a vida em piadas e usa risada para manter a solidao fora do enquadramento.","SHIT":"Tipo desgraça emocional. Voce consegue achar o pior angulo de qualquer coisa. Nao quer melhorar. Quer afundar com estilo.","SOLO":"Tipo andarilho protetor. Voce constroi seguranca por isolamento. Tem medo de conexao e chama o muro de independencia.","FUCK":"Tipo raiva emocional. Sua raiva nao e muito logica, mas e dedicada. Voce conseguiu se transformar numa ilha.","DEAD":"Tipo niilista adormecido. Sua mente esta congelada ha um tempo, e sua coragem para encarar desafios esta offline.","OH-NO":"Tipo ansiedade passiva. Voce e uma usina ambulante de ansiedade, ensaiando desastres que ainda nem pediram para existir.","POOR":"Tipo mendigo emocional. Voce interpreta o lado fraco para evitar conflito, e a fraqueza vira seu controle remoto favorito.","IMFW":"Tipo incendio emocional. Voce nao e apenas preguiçoso; tem orgulho disso. Sua vida e um protesto fraco, porem sincero, contra o ritmo social."},

    let step = 0;
    let currentLang = "zh";
    let currentView = "home";
    let userScores = {So:0, Lo:0, In:0, Ac:0, St:0};

    function getCopy() {
        return content[currentLang];
    }

    function getQuizData() {
        return getCopy().quizData;
    }

    function getDescriptions() {
        return getCopy().descriptions;
    }

    function renderHome() {
        currentView = "home";
        const copy = getCopy();
        document.getElementById('quiz-container').innerHTML = `
            <div class="text-center fade-in">
                <div class="text-7xl mb-6">🎭</div>
                <h1 class="text-5xl font-black mb-4 italic tracking-tighter">SBTI</h1>
                <p class="text-lg font-bold mb-10 text-gray-600 uppercase">${copy.homeSubtitle}</p>
                <button onclick="startQuiz()" class="px-12 py-5 bg-yellow-300 brutalist-btn font-black text-2xl uppercase italic">${copy.startButton}</button>
            </div>
        `;
    }

    function renderStaticContent() {
        const copy = getCopy();
        document.documentElement.lang = copy.langAttr;
        document.title = copy.title;
        document.getElementById('meta-description').setAttribute('content', copy.metaDescription);
        document.getElementById('about-title').textContent = copy.aboutTitle;
        document.getElementById('about-content').innerHTML = copy.aboutHtml;
        document.getElementById('tip-card').textContent = copy.tip;

        ['zh', 'en', 'pt'].forEach(lang => {
            document.getElementById(`lang-${lang}`).className = currentLang === lang
                ? 'px-4 py-2 font-black text-xs uppercase bg-black text-white'
                : 'px-4 py-2 font-black text-xs uppercase bg-white text-black';
        });
    }

    function setLanguage(lang, manual = false) {
        currentLang = content[lang] ? lang : 'en';
        if (manual) {
            try {
                localStorage.setItem('sbti-lang', currentLang);
            } catch (e) {}
        }
        renderStaticContent();
        if (currentView === 'quiz') {
            renderQuestion();
        } else if (currentView === 'result') {
            showResult();
        } else {
            renderHome();
        }
    }

    function detectLanguage() {
        try {
            const saved = localStorage.getItem('sbti-lang');
            if (saved && content[saved]) return saved;
        } catch (e) {}

        const englishRegions = new Set(['US','GB','UK','CA','AU','NZ','IE','ZA','SG','PH','IN','MY']);
        const zhTimezones = new Set(['Asia/Shanghai','Asia/Chongqing','Asia/Harbin','Asia/Urumqi','Asia/Hong_Kong','Asia/Macau','Asia/Taipei']);
        const brazilTimezones = new Set(['America/Sao_Paulo','America/Noronha','America/Belem','America/Fortaleza','America/Recife','America/Araguaina','America/Maceio','America/Bahia','America/Campo_Grande','America/Cuiaba','America/Santarem','America/Porto_Velho','America/Boa_Vista','America/Manaus','America/Eirunepe','America/Rio_Branco']);
        const candidates = navigator.languages && navigator.languages.length
            ? navigator.languages
            : [navigator.language || navigator.userLanguage || ''];

        for (const locale of candidates) {
            if (String(locale).toLowerCase().startsWith('zh')) return 'zh';
            const parts = String(locale).replace('_', '-').split('-');
            const primary = (parts[0] || '').toLowerCase();
            const region = (parts.slice(1).find(part => /^[a-z]{2}$/i.test(part)) || '').toUpperCase();
            if (primary === 'pt' || region === 'BR') return 'pt';
            if (primary === 'en' || englishRegions.has(region)) return 'en';
        }

        try {
            const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
            if (zhTimezones.has(timezone)) return 'zh';
            if (brazilTimezones.has(timezone)) return 'pt';
        } catch (e) {}

        return 'en';
    }

    function startQuiz() {
        currentView = "quiz";
        step = 0;
        userScores = {So:0, Lo:0, In:0, Ac:0, St:0};
        renderQuestion();
    }

    function renderQuestion() {
        const quizData = getQuizData();
        const q = quizData[step];
        const progress = ((step + 1) / quizData.length) * 100;
        const copy = getCopy();
        const container = document.getElementById('quiz-container');

        container.innerHTML = `
        <div class="fade-in">
            <div class="absolute top-0 left-0 w-full px-8 pt-6">
                <div class="flex justify-between text-xs font-black italic mb-2">
                    <span>${copy.ui.step} ${String(step+1).padStart(2,'0')}/${quizData.length}</span>
                    <span>${Math.round(progress)}%</span>
                </div>
                <div class="h-3 bg-gray-100 border-2 border-black rounded-full overflow-hidden">
                    <div class="h-full bg-black transition-all duration-300" style="width: ${progress}%"></div>
                </div>
            </div>
            <div class="mt-16">
                <h2 class="text-3xl font-black mb-10 text-center leading-tight">${q.q}</h2>
                <div class="grid gap-4">
                    ${q.options.map((opt, i) => `
                        <button onclick="handleAnswer(${i})" class="w-full py-5 px-6 brutalist-btn bg-white hover:bg-black hover:text-white font-bold text-lg text-left transition-all">
                            ${opt.t}
                        </button>
                    `).join('')}
                </div>
            </div>
        </div>
    `;
    }

    function handleAnswer(idx) {
        const quizData = getQuizData();
        const weights = quizData[step].options[idx].s;
        for(let k in weights) userScores[k] += weights[k];
        step++;
        if(step < quizData.length) renderQuestion(); else showResult();
    }

    function showResult() {
        currentView = "result";
        const copy = getCopy();
        const descriptions = getDescriptions();
        // 核心匹配算法
        let min = Infinity, matchObj = null;
        codes.forEach(c => {
            let dist = 0;
            ['So','Lo','In','Ac','St'].forEach((k, i) => dist += Math.pow(userScores[k] - c.s[i], 2));
            dist = Math.sqrt(dist);
            if(dist < min) {
                min = dist;
                matchObj = c; // 获取整个匹配对象
            }
        });

        const matchCode = matchObj.code;
        const matchIcon = matchObj.icon;

        const container = document.getElementById('quiz-container');
        container.innerHTML = `
        <div class="fade-in">
            <div class="relative brutalist-card p-8 bg-white mb-8 overflow-hidden text-left min-h-[350px]">
                <i class="pixelarticons ${matchIcon} absolute -bottom-4 -right-4 text-[12rem] text-gray-200 opacity-40 pointer-events-none z-0"></i>
                <div class="absolute -top-2 -right-10 bg-black text-white px-12 py-1 rotate-12 font-black text-[10px] uppercase z-20">${copy.ui.verified}</div>

                <div class="relative z-10">
                    <p class="text-[10px] font-black text-gray-400 uppercase mb-1">${copy.ui.report}</p>
                    <h2 class="text-8xl font-black italic underline mb-4 tracking-tighter">${matchCode}</h2>
                    <div class="h-2 bg-black w-20 mb-6"></div>
                    <p class="font-black text-xl text-gray-900 leading-tight mb-8">
                        ${descriptions[matchCode]}
                    </p>
                </div>

                <div class="pt-4 border-t-2 border-dashed border-gray-200 flex justify-between items-end relative z-10">
                    <div>
                        <p class="text-[10px] font-black text-gray-400 uppercase">${copy.ui.testSource}</p>
                        <p class="text-xs font-black italic">sbti.freeTools.best</p>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-4">
                <button onclick="copyShare('${matchCode}')" class="w-full py-5 brutalist-btn bg-green-400 font-black uppercase italic text-xl">${copy.ui.share}</button>
                <button onclick="startQuiz()" class="w-full py-3 brutalist-btn bg-white text-gray-400 font-bold uppercase text-xs">${copy.ui.retry}</button>
            </div>
        </div>
    `;
    }

    async function copyShare(code) {
        const copy = getCopy();
        const descriptions = getDescriptions();
        const desc = descriptions[code].substring(0, 30);
        const text = copy.ui.shareText(code, desc);
        try {
            await navigator.clipboard.writeText(text);
            alert(copy.ui.copied);
        } catch (e) {
            // 兜底方案
            const textArea = document.createElement("textarea");
            textArea.value = text;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            alert(copy.ui.copiedFallback);
        }
    }

    setLanguage(detectLanguage());

    (function() {
        // 1. 初始化 va 函数
        window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };

        // 2. 动态创建并插入外部 JS 文件
        const script = document.createElement('script');
        script.src = '/_vercel/insights/script.js';
        script.defer = true;
        document.head.appendChild(script);
    })();
</script>
