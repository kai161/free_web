    <link rel="alternate" hreflang="zh-Hans" href="https://squeeze.freetools.best/zh.html" />
    <link rel="alternate" hreflang="x-default" href="https://squeeze.freetools.best/" />

    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🖼️</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隐藏滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8fafc; }
        .gradient-text { background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .feature-tag { background: rgba(59, 130, 246, 0.1); color: #2563eb; padding: 4px 12px; border-radius: 99px; font-size: 0.85rem; font-weight: 600; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 18px; height: 18px; background: #2563eb; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
        .pattern-checkerboard { background-image: linear-gradient(45deg, #e5e7eb 25%, transparent 25%), linear-gradient(-45deg, #e5e7eb 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #e5e7eb 75%), linear-gradient(-45deg, transparent 75%, #e5e7eb 75%); background-size: 20px 20px; background-position: 0 0, 0 10px, 10px -10px, -10px 0px; }
    </style>
</head>
<body class="min-h-screen py-12 px-4 relative">

<div id="nav-placeholder"></div>
<script src="nav.js"></script>

    <div class="max-w-4xl mx-auto pt-8">
        <header class="text-center mb-12">
            <div class="inline-flex items-center gap-2 mb-4">
                <span class="feature-tag">🛡️ 100% 纯前端处理</span>
                <span class="feature-tag">⚡ 毫秒级极速输出</span>
            </div>
            <h1 class="text-5xl font-extrabold text-gray-900 mb-4 tracking-tight">
                免费在线图片压缩：<br> <span class="gradient-text">Squeeze It.</span>
            </h1>
            <p class="text-xl text-gray-600 max-w-2xl mx-auto leading-relaxed">
                自由选择转换为高兼容的 JPG 或保留透明度的 WebP。照片**绝不离开您的设备**，安全保护隐私。
            </p>
        </header>

        <main class="bg-white rounded-[2rem] shadow-2xl shadow-blue-100/50 border border-gray-100 overflow-hidden">
            <section id="dropZone" class="p-16 text-center cursor-pointer hover:bg-blue-50/30 transition-all group">
                <input type="file" id="fileInput" accept="image/jpeg,image/png,image/webp" class="hidden">
                <div class="w-20 h-20 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-6 group-hover:scale-110 transition-transform shadow-inner">
                    <svg class="w-10 h-10 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                </div>
                <h2 class="text-2xl font-bold text-gray-800">将图片拖拽至此</h2>
                <p class="text-gray-500 mt-2">或者点击此处选择文件 (支持 JPG, PNG, WebP)</p>
            </section>

            <section id="editorArea" class="hidden border-t border-gray-100 p-8 lg:p-12">
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-start">
                    <div class="space-y-4">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">实时预览</p>
                        <div class="rounded-2xl overflow-hidden bg-white border border-gray-200 shadow-inner min-h-[200px] flex items-center justify-center pattern-checkerboard">
                            <img id="preview" alt="压缩后图片预览" class="max-w-full h-auto block">
                        </div>
                    </div>

                    <div class="space-y-6">
                        <p class="text-xs font-bold text-gray-400 uppercase tracking-widest">压缩设置</p>
                        
                        <div class="bg-gray-50 p-6 rounded-2xl border border-gray-100 space-y-6">
                            
                            <div>
                                <div class="flex justify-between items-center mb-3">
                                    <span class="text-gray-500 text-xs uppercase font-semibold tracking-wider">输出格式</span>
                                </div>
                                <div class="flex gap-2 p-1 bg-gray-200/80 rounded-lg w-full" id="formatSelector">
                                    <button data-format="image/jpeg" class="format-btn active flex-1 py-2 text-sm font-bold rounded-md bg-white shadow-sm text-blue-600 transition-all">JPG (无透明背景)</button>
                                    <button data-format="image/webp" class="format-btn flex-1 py-2 text-sm font-bold rounded-md text-gray-500 hover:text-gray-700 transition-all">WebP (保留透明度)</button>
                                </div>
                            </div>

                            <hr class="border-gray-200">

                            <div>
                                <div class="flex justify-between items-end mb-4">
                                    <div>
                                        <span class="text-gray-500 text-xs uppercase font-semibold tracking-wider">画质 (Quality)</span>
                                        <div id="qualityVal" class="text-2xl font-bold text-blue-600">80%</div>
                                    </div>
                                    <div class="text-right">
                                        <span class="text-gray-500 text-xs uppercase font-semibold tracking-wider">预估大小</span>
                                        <div id="sizeInfo" class="text-2xl font-bold text-gray-800">0 KB</div>
                                    </div>
                                </div>
                                <input type="range" id="quality" min="1" max="100" value="80" class="w-full h-1.5 bg-gray-200 rounded-lg appearance-none cursor-pointer">
                            </div>
                        </div>

                        <div class="flex flex-col gap-3 pt-2">
                            <button id="downloadBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-8 rounded-2xl transition-all transform active:scale-[0.98] shadow-xl shadow-blue-200 flex items-center justify-center gap-2 text-lg">
                                立即下载
                            </button>
                            <button onclick="location.reload()" class="py-3 text-gray-400 hover:text-gray-600 font-medium transition-colors text-sm">
                                ← 压缩另一张图片
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
        
        <footer class="mt-12 pt-8 text-center text-gray-400 text-sm">
            <p>&copy; 2026 Squeeze It. 免费且保护隐私的图片压缩工具。</p>
        </footer>
    </div>

    <script>
        function switchLang(lang) {
            localStorage.setItem('squeeze_lang', lang);
            window.location.href = lang === 'en' ? '/' : '/zh.html';
        }

        const fileInput = document.getElementById('fileInput');
        const dropZone = document.getElementById('dropZone');
        const editorArea = document.getElementById('editorArea');
        const qualityInput = document.getElementById('quality');
        const qualityVal = document.getElementById('qualityVal');
        const preview = document.getElementById('preview');
        const sizeInfo = document.getElementById('sizeInfo');
        const downloadBtn = document.getElementById('downloadBtn');
        const formatBtns = document.querySelectorAll('.format-btn');

        let originalImage = new Image();
        let originalFileName = "squeezed_image.jpg";
        let selectedFormat = "image/jpeg"; // 默认转为 JPG

        // 处理格式选择逻辑
        formatBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // 切换按钮样式
                formatBtns.forEach(b => {
                    b.classList.remove('bg-white', 'shadow-sm', 'text-blue-600');
                    b.classList.add('text-gray-500');
                });
                e.target.classList.add('bg-white', 'shadow-sm', 'text-blue-600');
                e.target.classList.remove('text-gray-500');
                
                // 更新格式并重新压缩
                selectedFormat = e.target.getAttribute('data-format');
                compress(); 
            });
        });

        dropZone.onclick = () => fileInput.click();
        dropZone.ondragover = (e) => { e.preventDefault(); dropZone.classList.add('bg-blue-50'); };
        dropZone.ondragleave = () => dropZone.classList.remove('bg-blue-50');
        dropZone.ondrop = (e) => {
            e.preventDefault();
            dropZone.classList.remove('bg-blue-50');
            handleFile(e.dataTransfer.files[0]);
        };

        fileInput.onchange = (e) => handleFile(e.target.files[0]);

        function handleFile(file) {
            if (!file || !file.type.startsWith('image/')) return;
            originalFileName = file.name;

            // 智能优化：如果用户上传的是PNG，自动帮他切换到WebP以保留透明度
            if (file.type === 'image/png') {
                const webpBtn = document.querySelector('[data-format="image/webp"]');
                webpBtn.click(); // 自动触发点击事件，同步UI和状态
            }

            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = (e) => {
                originalImage.src = e.target.result;
                originalImage.onload = () => {
                    dropZone.classList.add('hidden');
                    editorArea.classList.remove('hidden');
                    compress();
                };
            };
        }

        qualityInput.oninput = () => {
            qualityVal.innerText = `${qualityInput.value}%`;
            compress();
        };

        function compress() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = originalImage.width;
            canvas.height = originalImage.height;

            // 如果选择了JPG，必须铺一层白底，否则原图透明区域会变成黑色
            if (selectedFormat === 'image/jpeg') {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            ctx.drawImage(originalImage, 0, 0);
            
            const quality = qualityInput.value / 100;
            const compressedDataUrl = canvas.toDataURL(selectedFormat, quality);
            preview.src = compressedDataUrl;
            
            const sizeInBytes = Math.round((compressedDataUrl.length - 22) * 3 / 4);
            sizeInfo.innerText = (sizeInBytes / 1024).toFixed(1) + ' KB';

            // 根据选择动态修改后缀名
            const ext = selectedFormat === 'image/jpeg' ? 'jpg' : 'webp';
            let baseName = originalFileName.includes('.') ? originalFileName.substring(0, originalFileName.lastIndexOf('.')) : originalFileName;

            downloadBtn.onclick = () => {
                const link = document.createElement('a');
                link.href = compressedDataUrl;
                link.download = `squeezed_${baseName}.${ext}`; 
                link.click();
            };
        }
    </script>
<script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>

</body>
</html>
