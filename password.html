<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>强密码生成器 | 100%纯本地生成不联网 | Free Tools</title>
    <meta name="description" content="一个完全在您浏览器本地运行的强密码生成器。利用本地算法生成，绝不通过网络传输，彻底保障您的密码安全。">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隐藏滚动条但保留滚动功能 */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8fafc; }
        .gradient-text { background: linear-gradient(135deg, #10b981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 20px; height: 20px; background: #10b981; border-radius: 50%; cursor: pointer; border: 2px solid white; box-shadow: 0 0 5px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="min-h-screen py-12 px-4">

<div id="nav-placeholder"></div>
<script src="nav.js"></script>

<div class="max-w-3xl mx-auto pt-8">
    <header class="text-center mb-12">
        <div class="inline-flex items-center gap-2 mb-4 bg-emerald-50 text-emerald-600 px-4 py-1.5 rounded-full text-sm font-semibold">
            🛡️ 100% 本地生成，断网可用
        </div>
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">
            本地强密码生成器
        </h1>
        <p class="text-lg text-gray-600 max-w-xl mx-auto">
            您的密码**绝不会离开您的设备**。通过浏览器原生算法在本地瞬间生成，杜绝任何泄露风险。
        </p>
    </header>

    <main class="bg-white rounded-[2rem] shadow-xl shadow-emerald-100/50 border border-gray-100 p-8 lg:p-12">

        <div class="relative mb-10">
            <div class="bg-gray-50 border-2 border-gray-200 rounded-2xl p-6 pr-20 break-all min-h-[100px] flex items-center justify-center text-center">
                <span id="passwordOutput" class="text-3xl md:text-4xl font-mono text-gray-800 tracking-wider">点击生成按钮</span>
            </div>
            <button id="copyBtn" class="absolute right-4 top-1/2 -translate-y-1/2 p-3 bg-white border border-gray-200 hover:border-emerald-500 hover:text-emerald-600 rounded-xl shadow-sm transition-all group" title="复制密码">
                <svg class="w-6 h-6 text-gray-400 group-hover:text-emerald-500 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
            </button>
        </div>

        <div class="space-y-8">
            <div>
                <div class="flex justify-between items-end mb-4">
                    <span class="text-gray-600 font-semibold">密码长度</span>
                    <div id="lengthVal" class="text-2xl font-bold text-emerald-600">16</div>
                </div>
                <input type="range" id="lengthSlider" min="8" max="64" value="16" class="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer">
            </div>

            <div class="grid grid-cols-2 gap-4">
                <label class="flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition-colors">
                    <input type="checkbox" id="incUpper" checked class="w-5 h-5 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                    <span class="ml-3 font-medium text-gray-700">大写字母 (A-Z)</span>
                </label>
                <label class="flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition-colors">
                    <input type="checkbox" id="incLower" checked class="w-5 h-5 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                    <span class="ml-3 font-medium text-gray-700">小写字母 (a-z)</span>
                </label>
                <label class="flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition-colors">
                    <input type="checkbox" id="incNumbers" checked class="w-5 h-5 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                    <span class="ml-3 font-medium text-gray-700">数字 (0-9)</span>
                </label>
                <label class="flex items-center p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-gray-50 transition-colors">
                    <input type="checkbox" id="incSymbols" checked class="w-5 h-5 text-emerald-600 rounded border-gray-300 focus:ring-emerald-500">
                    <span class="ml-3 font-medium text-gray-700">符号 (!@#$...)</span>
                </label>
            </div>

            <button id="generateBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-xl shadow-lg shadow-emerald-200 transition-transform active:scale-[0.98] text-lg mt-4">
                🔄 重新生成密码
            </button>
        </div>
    </main>
</div>

<script>
    const DOM = {
        output: document.getElementById('passwordOutput'),
        slider: document.getElementById('lengthSlider'),
        lengthVal: document.getElementById('lengthVal'),
        btnGen: document.getElementById('generateBtn'),
        btnCopy: document.getElementById('copyBtn'),
        chkUpper: document.getElementById('incUpper'),
        chkLower: document.getElementById('incLower'),
        chkNumbers: document.getElementById('incNumbers'),
        chkSymbols: document.getElementById('incSymbols')
    };

    const CHARS = {
        upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lower: 'abcdefghijklmnopqrstuvwxyz',
        numbers: '0123456789',
        symbols: '!@#$%^&*()_+~`|}{[]:;?><,./-='
    };

    function generatePassword() {
        let charset = '';
        if (DOM.chkUpper.checked) charset += CHARS.upper;
        if (DOM.chkLower.checked) charset += CHARS.lower;
        if (DOM.chkNumbers.checked) charset += CHARS.numbers;
        if (DOM.chkSymbols.checked) charset += CHARS.symbols;

        if (charset === '') {
            DOM.output.textContent = '请至少选择一种字符类型！';
            DOM.output.classList.add('text-red-500');
            return;
        }

        DOM.output.classList.remove('text-red-500');
        const length = DOM.slider.value;
        let password = '';

        // 使用浏览器原生的 Crypto API 保证随机性更安全
        const array = new Uint32Array(length);
        window.crypto.getRandomValues(array);

        for (let i = 0; i < length; i++) {
            password += charset[array[i] % charset.length];
        }

        DOM.output.textContent = password;
    }

    async function copyToClipboard() {
        const text = DOM.output.textContent;
        if (text === '点击生成按钮' || text.includes('请至少选择')) return;

        try {
            await navigator.clipboard.writeText(text);
            const originalHtml = DOM.btnCopy.innerHTML;
            DOM.btnCopy.innerHTML = `<span class="text-emerald-600 font-bold text-sm">已复制!</span>`;
            setTimeout(() => DOM.btnCopy.innerHTML = originalHtml, 2000);
        } catch (err) {
            alert('复制失败，请手动复制');
        }
    }

    // 事件监听
    DOM.slider.addEventListener('input', (e) => {
        DOM.lengthVal.textContent = e.target.value;
        generatePassword();
    });

    DOM.btnGen.addEventListener('click', generatePassword);
    DOM.btnCopy.addEventListener('click', copyToClipboard);

    [DOM.chkUpper, DOM.chkLower, DOM.chkNumbers, DOM.chkSymbols].forEach(chk => {
        chk.addEventListener('change', generatePassword);
    });

    // 初始化生成一次
    generatePassword();
</script>

</body>
</html>
