<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>绝对音感训练器 | Web Audio 原生发音 | Free Tools</title>
    <meta name="description" content="使用纯浏览器 Web Audio API 实时生成无损音频，无需下载任何音频文件。随时随地训练您的绝对音感和听音辨音能力。">

    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', -apple-system, sans-serif; background-color: #f8fafc; }
        .gradient-text { background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* 钢琴按键的特殊交互动画 */
        .key-btn { transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1); }
        .key-btn:active { transform: scale(0.95) translateY(4px); box-shadow: none !important; }

        /* 钢琴白键与黑键的基础样式 */
        .key-white { background: #ffffff; color: #1f2937; border: 2px solid #e5e7eb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 8px 0 #d1d5db; }
        .key-black { background: #1f2937; color: #f9fafb; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), 0 8px 0 #111827; z-index: 10; }
    </style>
</head>
<body class="min-h-screen py-12 px-4">

<div id="nav-placeholder"></div>
<script src="nav.js"></script>

<div class="max-w-3xl mx-auto">
    <header class="text-center mb-10">
        <div class="inline-flex items-center gap-2 mb-4 bg-indigo-50 text-indigo-600 px-4 py-1.5 rounded-full text-sm font-semibold">
            🛡️ 无需下载音频 · 函数实时合成声音
        </div>
        <h1 class="text-4xl font-extrabold text-gray-900 mb-4 tracking-tight">
            绝对音感训练器
        </h1>
        <p class="text-gray-500 max-w-lg mx-auto">
            点击播放按钮聆听一段纯正的正弦波音符，然后尝试在下方键盘中猜出它是哪个音。
        </p>
    </header>

    <main class="bg-white rounded-[2rem] shadow-xl shadow-indigo-100/50 border border-gray-100 p-6 lg:p-10">

        <div class="flex justify-between items-center mb-8 p-6 bg-gray-50 rounded-2xl border border-gray-100">
            <div class="text-center">
                <div class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-1">准确率</div>
                <div class="text-3xl font-extrabold text-gray-800" id="accuracyDisplay">0%</div>
            </div>
            <div class="text-center border-l border-r border-gray-200 px-8">
                <div class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-1">得分</div>
                <div class="text-4xl font-extrabold text-indigo-600" id="scoreDisplay">0</div>
            </div>
            <div class="text-center">
                <div class="text-sm font-bold text-gray-400 uppercase tracking-widest mb-1">尝试次数</div>
                <div class="text-3xl font-extrabold text-gray-800" id="attemptsDisplay">0</div>
            </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-center mb-8">
            <button id="btnPlay" class="flex-1 py-4 px-8 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-indigo-200 transition-transform active:scale-[0.98] text-lg flex items-center justify-center gap-2">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20"><path d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd" fill-rule="evenodd"></path></svg>
                播放新音符
            </button>
            <button id="btnReplay" class="py-4 px-8 bg-white border-2 border-gray-200 hover:border-indigo-600 text-gray-700 hover:text-indigo-600 font-bold rounded-xl transition-colors text-lg disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                🔁 再听一遍
            </button>
        </div>

        <div id="feedbackMsg" class="h-8 text-center font-bold text-lg mb-4 opacity-0 transition-opacity duration-300">
            准备好了吗？点击上方播放按钮开始！
        </div>

        <div class="grid grid-cols-7 gap-2 relative mt-12 select-none">
            <button class="key-btn key-white h-32 rounded-lg font-bold text-xl relative pb-4 flex items-end justify-center" data-note="C">C</button>
            <button class="key-btn key-white h-32 rounded-lg font-bold text-xl relative pb-4 flex items-end justify-center" data-note="D">D</button>
            <button class="key-btn key-white h-32 rounded-lg font-bold text-xl relative pb-4 flex items-end justify-center" data-note="E">E</button>
            <button class="key-btn key-white h-32 rounded-lg font-bold text-xl relative pb-4 flex items-end justify-center" data-note="F">F</button>
            <button class="key-btn key-white h-32 rounded-lg font-bold text-xl relative pb-4 flex items-end justify-center" data-note="G">G</button>
            <button class="key-btn key-white h-32 rounded-lg font-bold text-xl relative pb-4 flex items-end justify-center" data-note="A">A</button>
            <button class="key-btn key-white h-32 rounded-lg font-bold text-xl relative pb-4 flex items-end justify-center" data-note="B">B</button>

            <div class="absolute top-0 left-0 w-full flex justify-between px-[7%] pointer-events-none" style="height: 60%;">
                <div class="w-[28%] flex justify-around">
                    <button class="key-btn key-black w-12 rounded-b-lg font-bold text-sm pointer-events-auto flex items-end justify-center pb-3" data-note="C#">C#</button>
                    <button class="key-btn key-black w-12 rounded-b-lg font-bold text-sm pointer-events-auto flex items-end justify-center pb-3" data-note="D#">D#</button>
                </div>
                <div class="w-[14%]"></div>
                <div class="w-[42%] flex justify-around">
                    <button class="key-btn key-black w-12 rounded-b-lg font-bold text-sm pointer-events-auto flex items-end justify-center pb-3" data-note="F#">F#</button>
                    <button class="key-btn key-black w-12 rounded-b-lg font-bold text-sm pointer-events-auto flex items-end justify-center pb-3" data-note="G#">G#</button>
                    <button class="key-btn key-black w-12 rounded-b-lg font-bold text-sm pointer-events-auto flex items-end justify-center pb-3" data-note="A#">A#</button>
                </div>
            </div>
        </div>

    </main>
</div>

<script>
    // --- Web Audio API 核心逻辑 ---
    let audioCtx = null;
    let currentNoteObj = null;
    let isWaitingForGuess = false;

    // 记录状态
    let score = 0;
    let attempts = 0;

    // 中音区 (4th Octave) 频率映射表
    const notes = [
        { name: "C", freq: 261.63 },
        { name: "C#", freq: 277.18 },
        { name: "D", freq: 293.66 },
        { name: "D#", freq: 311.13 },
        { name: "E", freq: 329.63 },
        { name: "F", freq: 349.23 },
        { name: "F#", freq: 369.99 },
        { name: "G", freq: 392.00 },
        { name: "G#", freq: 415.30 },
        { name: "A", freq: 440.00 },
        { name: "A#", freq: 466.16 },
        { name: "B", freq: 493.88 }
    ];

    // 初始化 AudioContext
    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    // 播放声音函数 (带 ADSR 包络以防止爆音)
    function playTone(frequency) {
        initAudio();

        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.type = 'triangle'; // 使用三角波，声音比正弦波更像乐器，比方波柔和
        oscillator.frequency.value = frequency;

        // 包络控制 (Attack and Release) 防止声音开头和结尾发出 "啪" 的电流声
        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(1, audioCtx.currentTime + 0.05); // Attack
        gainNode.gain.setValueAtTime(1, audioCtx.currentTime + 1.0); // Sustain
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.3); // Release

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.start(audioCtx.currentTime);
        oscillator.stop(audioCtx.currentTime + 1.4);
    }

    // --- UI 交互逻辑 ---
    const btnPlay = document.getElementById('btnPlay');
    const btnReplay = document.getElementById('btnReplay');
    const feedbackMsg = document.getElementById('feedbackMsg');
    const keyBtns = document.querySelectorAll('.key-btn');

    function updateStats() {
        document.getElementById('scoreDisplay').textContent = score;
        document.getElementById('attemptsDisplay').textContent = attempts;
        const acc = attempts === 0 ? 0 : Math.round((score / attempts) * 100);
        document.getElementById('accuracyDisplay').textContent = `${acc}%`;
    }

    function showMessage(text, colorClass) {
        feedbackMsg.textContent = text;
        feedbackMsg.className = `h-8 text-center font-bold text-lg mb-4 transition-opacity duration-300 opacity-100 ${colorClass}`;
    }

    // 播放新音符
    btnPlay.addEventListener('click', () => {
        // 随机抽取一个音符
        const randomIndex = Math.floor(Math.random() * notes.length);
        currentNoteObj = notes[randomIndex];

        playTone(currentNoteObj.freq);

        isWaitingForGuess = true;
        btnReplay.disabled = false;

        showMessage('聆听中... 请点击下方对应的键盘', 'text-indigo-600');

        // 重置所有按键的颜色
        keyBtns.forEach(btn => {
            btn.classList.remove('bg-green-500', 'bg-red-500', 'text-white', '!border-green-600', '!border-red-600');
        });
    });

    // 重放当前音符
    btnReplay.addEventListener('click', () => {
        if (currentNoteObj) {
            playTone(currentNoteObj.freq);
        }
    });

    // 用户猜测逻辑
    keyBtns.forEach(btn => {
        btn.addEventListener('click', (e) => {
            // 如果用户还没点播放，或者已经猜过这轮了，就不做反应
            if (!isWaitingForGuess || !currentNoteObj) {
                initAudio(); // 依然初始化一下音频权限
                return;
            }

            const guessedNoteName = e.target.getAttribute('data-note');
            attempts++;

            if (guessedNoteName === currentNoteObj.name) {
                // 猜对了
                score++;
                showMessage(`🎉 恭喜你猜对了！这是 ${currentNoteObj.name} 音。`, 'text-green-500');
                e.target.classList.add('bg-green-500', 'text-white', '!border-green-600');
                isWaitingForGuess = false; // 结束这轮
            } else {
                // 猜错了
                showMessage(`❌ 猜错了，你选的是 ${guessedNoteName}。再听一次试试！`, 'text-red-500');
                e.target.classList.add('bg-red-500', 'text-white', '!border-red-600');

                // 自动重放一次让用户加深印象
                setTimeout(() => {
                    if(currentNoteObj) playTone(currentNoteObj.freq);
                }, 500);
            }

            updateStats();
        });
    });
</script>
<script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
